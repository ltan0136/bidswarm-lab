# BidSwarm Lab - AuctionNet backend EXAMPLE (not runnable yet).
#
# The AuctionNet adapter is not implemented (integration_status = not_integrated).
# `python -m bidswarm run --config configs/auctionnet.example.toml` must fail with
# BackendNotIntegratedError; it never falls back to the toy backend.
# See docs/AUCTIONNET_INTEGRATION.md.

[experiment]
name = "auctionnet_example"
seed = 20261029
replicates = 3

[environment]
backend = "auctionnet"
repo_path = "/path/to/AuctionNet"   # local checkout; not cloned or downloaded by this project
commit_sha = "c20de631a40e24669d1d6a8e2acefd8f492f172d"  # verified in step 1 (docs/AUCTIONNET_INTEGRATION.md)
evaluation_path = "online"          # online simulation needs no extra download; offline needs ~80GB of data
python_executable = "python3.9"     # upstream needs Python 3.9 (checked with 3.9.25)
num_time_steps = 48                 # verified: config/test.gin NUM_TICK

[splits]
train = 4
validation = 4
test = 4

[search]
policy = "dual_control"
proposer = "es"
modes = ["single", "independent"]
independent_workers = 4
candidates_per_round = 2
train_episode_budget = 96
fitness_metric = "score_expected"

[selection]
top_k = 4
