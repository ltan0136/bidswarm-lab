# BidSwarm Lab - CMA-ES baseline: toy_cooperative.toml with proposer = "cmaes", R = 100.
# Same seed, scenarios and budget as toy_cooperative.toml, so every (replicate, mode) pairs with
# the ES run for a CMA-ES - ES comparison (scripts/power_analysis.py --control).
# Results say nothing about AuctionNet or real revenue.

[experiment]
name = "toy_cooperative_cmaes"
seed = 20261030
replicates = 100

[environment]
backend = "toy"
num_time_steps = 48
opportunities_per_step = 300
budget_range = [400.0, 1200.0]
cpa_target_range = [6.0, 12.0]
num_categories = 5
pvalue_beta = [2.0, 98.0]        # pValue ~ Beta(a, b), mean 0.02
sigma_ratio_range = [0.1, 0.5]   # pValueSigma = ratio * pValue
exposure_prob = 0.8
price_scale = 0.15               # least_winning_cost scale at the mean pValue
price_pvalue_elasticity = 0.8
price_noise_sigma = 0.5          # log-normal noise of least_winning_cost
price_time_amplitude = 0.3       # sinusoidal time-of-day price factor

[splits]
train = 4
validation = 8
test = 16

[search]
policy = "dual_control"
proposer = "cmaes"
modes = ["single", "independent", "cooperative"]
independent_workers = 4                 # also the cooperative N
exchange_interval = 1                   # cooperative: ring migration after every round but the last
candidates_per_round = 2
# 192 / 4 train scenarios = 48 candidates; single: 24 rounds, independent: 12 per worker, 6 rounds
train_episode_budget = 192
fitness_metric = "score_expected"

[search.es]
sigma_init = 0.2
sigma_min = 0.01
sigma_max = 0.5
success_factor = 1.22
failure_factor = 0.82

[search.cmaes]
population = 0                          # 0 = 4 + floor(3 ln 8) = 10, a multiple of candidates_per_round
sigma_init = 0.3
sigma_min = 0.001
sigma_max = 1.0

[selection]
top_k = 4

[runtime]
episode_timeout_s = 120.0
